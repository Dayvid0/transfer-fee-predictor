name: Player value CI
on:
  pull_request:
    paths: ["player-value-predictor/**", ".github/workflows/player-value-ci.yml"]
  push:
    branches: [main]
    paths: ["player-value-predictor/**", ".github/workflows/player-value-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-value-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Lint, tests and container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: player-value-predictor
    env:
      PVP_LLM_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: player-value-predictor/requirements-dev.txt
      - name: Install pinned test environment
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies and lint
        run: |
          python -m pip check
          ruff check --no-cache src tests scripts
      - name: Unit and API tests (provider mocked)
        run: python -m pytest -q -p no:cacheprovider
      - name: Verify release bundle
        run: python scripts/verify_release.py
      - name: Build runtime image
        run: docker build --tag player-value:${{ github.sha }} .
      - name: Start container
        run: docker run --detach --name player-value-smoke --env PORT=8000 --env PVP_LLM_ENABLED=false --read-only --tmpfs /tmp:rw,nosuid,size=64m --memory=512m --cpus=1 player-value:${{ github.sha }}
      - name: Run smoke test inside the image
        run: docker exec player-value-smoke python src/smoke.py
      - name: Container logs
        if: always()
        run: docker logs player-value-smoke || true
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force player-value-smoke || true
