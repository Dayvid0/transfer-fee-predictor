# Streamlit theme: dark base with a pitch-green accent.
# Everything renders locally. "sans serif" resolves to the local system font
# stack, so no font is ever downloaded.

[theme]
base = "dark"
primaryColor = "#22C55E"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#141D2E"
textColor = "#E6EDF5"
linkColor = "#34D399"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
